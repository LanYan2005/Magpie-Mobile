name: magpie_mobile
description: "Magpie Android + iOS 本机网关与移动控制台原型。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  file_selector: 1.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 9.2.4
  flutter_svg: 2.3.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/magpie.png
    - assets/upstream/ui/
    - assets/upstream/vendors/
